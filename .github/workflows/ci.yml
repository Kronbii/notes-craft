name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (Swift ${{ matrix.swift }}, Linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2"]
    container: swift:${{ matrix.swift }}
    env:
      NOTESCRAFT_CORE_ONLY: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check syntax
        run: for f in scripts/*/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck --severity=warning scripts/*/*.sh
